encoding: utf-8
schema:
  fields:
  - name: id
    type: integer
    description: Unique identifier for the interest
    constraints:
      unique: true
    example: '11318'
  - name: summary
    type: string
    description: Text summary of the interest
    constraints:
      unique: false
    example: Payment expected for services on 07 July 2026 - £1,000.00
  - name: parent_interest_id
    type: integer
    description: Unique identifier for the parent interest
    constraints:
      unique: false
    example: '10624'
  - name: registered
    type: string
    description: registered date
    constraints:
      unique: false
    example: '2024-11-20'
  - name: published
    type: string
    description: published date
    constraints:
      unique: false
    example: '2024-11-20'
  - name: updated_1
    type: string
    description: updated date
    constraints:
      unique: false
      enum:
      - '2025-11-20'
      - '2025-12-09'
      - '2025-12-18'
      - '2025-12-22'
      - '2026-01-22'
      - '2026-05-06'
      - '2026-05-28'
      - '2026-06-01'
      - '2026-07-08'
    example: '2025-11-20'
  - name: category
    type: string
    description: Category of the interest
    constraints:
      unique: false
      enum:
      - Employment and earnings - Ad hoc payments
    example: Employment and earnings - Ad hoc payments
  - name: mnis_id
    type: integer
    description: Parliament's unique identifier for the member
    constraints:
      unique: false
    example: '1171'
  - name: twfy_id
    type: string
    description: TheyWorkForYou ID for the member
    constraints:
      unique: false
    example: '10001'
  - name: party
    type: string
    description: TWFY ID for the party as of this release date
    constraints:
      unique: false
      enum:
      - conservative
      - green
      - independent
      - labour
      - labourco-operative
      - liberal-democrat
      - plaid-cymru
      - reform
      - restore-britain
    example: conservative
  - name: member
    type: string
    description: Name of the MP
    constraints:
      unique: false
    example: Alan Mak
  - name: payment_received
    type: boolean
    description: Whether there was a payment received
    constraints:
      unique: false
      enum:
      - false
      - true
    example: 'False'
  - name: received_date
    type: string
    description: Date the payment was received
    constraints:
      unique: false
      enum:
      - ''
    example: ''
  - name: job_title
    type: string
    description: Job the MP was paid for
    constraints:
      unique: false
    example: Advance for a book
  - name: payment_type
    type: string
    description: Type of payment
    constraints:
      unique: false
      enum:
      - In kind
      - Monetary
    example: In kind
  - name: payment_description
    type: string
    description: Description of the payment
    constraints:
      unique: false
    example: (Includes 15% to be deducted on account of Chambers' fees)
  - name: value
    type: number
    description: Value of the payment (£)
    constraints:
      unique: false
    example: '100.0'
  - name: hours_worked
    type: number
    description: Hours worked for the payment
    constraints:
      unique: false
    example: '0.0'
  - name: hours_details
    type: string
    description: Details of the hours worked
    constraints:
      unique: false
    example: (1.5 hours per week over a 4 week period)
  - name: is_ultimate_payer_different
    type: boolean
    description: Whether the ultimate payer is different
    constraints:
      unique: false
      enum:
      - false
      - true
    example: 'False'
  - name: ultimate_payer_name
    type: string
    description: Name of the ultimate payer
    constraints:
      unique: false
    example: ALCS
  - name: ultimate_payer_protected_by_confidentiality
    type: boolean
    description: Whether the ultimate payer is protected by confidentiality
    constraints:
      unique: false
      enum:
      - false
    example: 'False'
  - name: ultimate_payer_address
    type: string
    description: Address of the ultimate payer
    constraints:
      unique: false
    example: 1 Centenary Square, Birmingham B1 1HQ
  - name: ultimate_payer_nature_of_business
    type: string
    description: Nature of business of the ultimate payer
    constraints:
      unique: false
    example: Agentic AI for Enterprise finance
  - name: is_payment_donated
    type: boolean
    description: Whether the payment was donated
    constraints:
      unique: false
      enum:
      - false
      - true
    example: 'False'
  - name: donatee_paid_by
    type: string
    description: Who the payment was donated to
    constraints:
      unique: false
      enum:
      - Donated by the Member to the recipient
      - Paid direct to the recipient by the payer
    example: Donated by the Member to the recipient
  - name: donatee_type
    type: string
    description: Type of the donatee
    constraints:
      unique: false
      enum:
      - Charity
      - Other
    example: Charity
  - name: donatee_details
    type: string
    description: Details of the donatee
    constraints:
      unique: false
      enum:
      - Donated to son, who is a student
      - Jamaica Hurricane Melissa Relief Fund
      - a charity in my constituency
    example: Donated to son, who is a student
  - name: link
    type: string
    description: Link to the interest
    constraints:
      unique: true
    example: https://interests-api.parliament.uk/api/v1/Interests/11318
  - name: updated_2
    type: string
    description: Date the interest was updated
    constraints:
      unique: false
      enum:
      - '2026-05-06'
    example: '2026-05-06'
  - name: category_code
    type: string
    description: Code for the category of the interest
    constraints:
      unique: false
      enum:
      - '1.1'
    example: '1.1'
